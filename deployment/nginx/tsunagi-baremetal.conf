# Bare-metal nginx site for Tsunagi (no Docker).
#
#   sudo cp tsunagi-baremetal.conf /etc/nginx/sites-available/tsunagi
#   sudo ln -s /etc/nginx/sites-available/tsunagi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot --nginx afterwards; it rewrites this file to add the TLS block
# and the port 80 redirect.

upstream tsunagi_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sms.example.com;

    # Message bodies are small; this mostly caps abusive batch uploads.
    client_max_body_size 2m;

    access_log /var/log/nginx/tsunagi.access.log;
    error_log  /var/log/nginx/tsunagi.error.log;

    # The dashboard is a static build served straight off disk — no Node
    # process in production.
    root /opt/tsunagi/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the shell, or a deploy strands clients on stale asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://tsunagi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # GET /api/v1/messages/wait holds the connection open by design.
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://tsunagi_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://tsunagi_api/health;
        access_log off;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://tsunagi_api;
        proxy_set_header Host $host;
    }
}
