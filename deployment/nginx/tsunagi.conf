upstream tsunagi_api {
    server api:8000;
}

upstream tsunagi_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Message bodies are small; this mostly caps abusive batch uploads.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://tsunagi_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GET /api/v1/messages/wait holds the connection open by design.
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://tsunagi_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://tsunagi_api/health;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://tsunagi_api;
        proxy_set_header Host $host;
    }

    # The dashboard. It shares an origin with the API, so the browser needs no
    # CORS grant and the WebSocket inherits the page's scheme.
    location / {
        proxy_pass http://tsunagi_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
