# TLS-terminating variant of tsunagi.conf, activated by docker-compose.tls.yml.
# ${TSUNAGI_DOMAIN} is substituted at container start by nginx's envsubst
# entrypoint (the file is mounted into /etc/nginx/templates/).

upstream tsunagi_api {
    server api:8000;
}

upstream tsunagi_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name ${TSUNAGI_DOMAIN};

    # Certbot writes its challenge files here; this must stay reachable over
    # plain HTTP or renewals fail.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${TSUNAGI_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${TSUNAGI_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${TSUNAGI_DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Two years, and only after you have confirmed renewals work: HSTS cannot
    # be un-published, and a lapsed certificate then locks clients out.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://tsunagi_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GET /api/v1/messages/wait holds the connection open by design.
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://tsunagi_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://tsunagi_api/health;
        access_log off;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://tsunagi_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://tsunagi_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
