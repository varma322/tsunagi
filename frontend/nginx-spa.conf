server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: every unknown path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves clients on old assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
